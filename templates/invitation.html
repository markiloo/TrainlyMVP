<main class="login-wrap"><section class="login-brand">{% include 'brand.html' %}<div><span class="eyebrow" style="color:var(--gold)">JOIN YOUR TEAM</span><h1>Learning starts here.</h1><p>You have been invited to {{ info.workspace }}.</p></div></section><section class="login-side"><form class="login-box" id="accept-invite"><span class="eyebrow">INVITATION</span><h2>Create your learner account</h2><p>{{ info.email }}{% if info.module %} · {{ info.module }}{% endif %}</p><div class="field"><label for="invite-name">Your name</label><input id="invite-name" required maxlength="100" autocomplete="name"></div><div class="field"><label for="invite-password">Password</label><input id="invite-password" type="password" required minlength="8" autocomplete="new-password"></div><button class="button" style="width:100%">Join workspace</button></form></section></main>
